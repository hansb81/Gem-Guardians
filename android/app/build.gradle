apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 버전은 src/config/gameInfo.js 하나에서 읽는다(게임 정보 화면과 같은 값): version -> versionName, build -> versionCode.
def gameInfo = file('../../src/config/gameInfo.js').text
def gameVersion = (gameInfo =~ /version:\s*'([^']+)'/)[0][1]
def gameBuild = ((gameInfo =~ /build:\s*(\d+)/)[0][1]) as int

// 릴리스 서명: android/keystore.properties(저장소에 안 올림)가 있을 때만. 없으면 서명 안 된 릴리스가 나온다.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "com.teamsdb.gemguardians"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.teamsdb.gemguardians"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gameBuild
        versionName gameVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // 마켓별 결제(docs/platforms.md §14-3). 같은 applicationId - 원스토어는 Play와 같은 패키지명·서명 키로 올린다(§14-2 O1).
    // play = RevenueCat(Play Billing), onestore = 원스토어 IAP SDK(src/onestore). 다른 마켓 결제 코드가 산출물에 섞이지 않게 나눈다.
    flavorDimensions = ['store']
    productFlavors {
        play { dimension 'store' }
        onestore { dimension 'store' }
    }
}

// capacitor.build.gradle이 Java 21로 컴파일한다 - Kotlin도 같은 바이트코드 버전.
kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21 }
}

repositories {
    // 원스토어 SDK 저장소 - 문서는 mavenCentral(2026-04~), GitHub README는 repo.onestore.net이라 둘 다(§14-5).
    // 저장소는 flavor별로 못 나눠서 이 그룹만 받게 막아 둔다(쓰는 곳은 onestoreImplementation뿐).
    maven {
        url 'https://repo.onestore.net/repository/onestore-sdk-public'
        content { includeGroup 'com.onestorecorp.sdk' }
    }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---- 마켓별 결제 의존성 ----
// capacitor.build.gradle은 cap sync가 매번 다시 만든다(모든 플러그인을 implementation으로) - 여기서 Play 결제 플러그인을
// play flavor로만 옮긴다. onestore 산출물에 Play Billing(com.android.billingclient)이 없어야 한다.
def PLAY_ONLY_PLUGINS = ['revenuecat-purchases-capacitor': '@revenuecat/purchases-capacitor']
configurations.implementation.dependencies.removeAll { it instanceof ProjectDependency && PLAY_ONLY_PLUGINS.containsKey(it.name) }
dependencies {
    PLAY_ONLY_PLUGINS.keySet().each { playImplementation project(":$it") }
    onestoreImplementation "com.onestorecorp.sdk:sdk-iap:21.04.00"
}

// Capacitor는 시작할 때 capacitor.plugins.json의 클래스를 전부 읽고, 하나라도 없으면 플러그인 전체 로드가 실패한다.
// onestore 빌드용으로 Play 전용 플러그인을 빼고 OneStoreIap(app/src/onestore)을 넣은 사본을 생성 assets로 붙인다(main 것을 덮어씀).
abstract class OneStorePluginsJson extends DefaultTask {
    @InputFile abstract RegularFileProperty getSource()
    @Input abstract ListProperty<String> getDropPkgs()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @TaskAction void run() {
        def list = new groovy.json.JsonSlurper().parse(source.get().asFile).findAll { !dropPkgs.get().contains(it.pkg) }
        list << [pkg: 'OneStoreIap', classpath: 'com.teamsdb.gemguardians.onestore.OneStoreIapPlugin']
        outputDir.get().file('capacitor.plugins.json').asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(list))
    }
}
def onestorePluginsJson = tasks.register('onestorePluginsJson', OneStorePluginsJson) {
    source = file('src/main/assets/capacitor.plugins.json') // cap sync가 만든다 - sync 전이면 이 태스크가 실패한다.
    dropPkgs = PLAY_ONLY_PLUGINS.values().toList()
}
androidComponents {
    onVariants(selector().withFlavor('store', 'onestore')) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(onestorePluginsJson) { it.outputDir }
    }
}

// ---- 마켓 섞임 안전장치 ----
// 1) 빌드 전: main/assets/public(play·onestore가 같이 쓰는 웹 파일)의 platform.txt(vite가 씀)가 flavor 이름과 같아야 한다.
//    Android Studio에서 바로 빌드해도 다른 마켓 JS가 들어가지 않게.
// 2) 빌드 후: APK/AAB에 다른 마켓 결제 클래스·플러그인이 없는지 본다. RevenueCat 안에 Play Billing이 들어 있어서
//    onestore는 둘 다 검사한다.
def STORE_RULES = [
    onestore: [classes: ['Lcom/revenuecat/', 'Lcom/android/billingclient/'], plugins: PLAY_ONLY_PLUGINS.values().toList()],
    play    : [classes: ['Lcom/gaa/sdk/'], plugins: ['OneStoreIap']],
]

abstract class VerifyStoreArtifact extends DefaultTask {
    @InputFiles abstract ConfigurableFileCollection getArtifactFiles() // APK 폴더 또는 AAB 파일
    @Input abstract ListProperty<String> getForbiddenClasses()
    @Input abstract ListProperty<String> getForbiddenPlugins()
    @TaskAction void run() {
        def files = artifactFiles.files.collectMany { it.isDirectory() ? it.listFiles().findAll { f -> f.name.endsWith('.apk') } : [it] }
        if (files.isEmpty()) throw new GradleException('검사할 APK/AAB가 없다')
        files.each { f ->
            def errors = []
            int dex = 0
            boolean pluginsJson = false
            new java.util.zip.ZipFile(f).withCloseable { zip ->
                zip.entries().each { e ->
                    if (e.name ==~ /(base\/dex\/)?classes\d*\.dex/) {
                        dex++
                        def text = new String(zip.getInputStream(e).bytes, 'ISO-8859-1') // dex 문자열 표의 타입 이름(Lcom/...;)
                        forbiddenClasses.get().each { c -> if (text.contains(c)) errors << "${c} (${e.name})" }
                    } else if (e.name.endsWith('assets/capacitor.plugins.json')) {
                        pluginsJson = true
                        def pkgs = new groovy.json.JsonSlurper().parse(zip.getInputStream(e)).collect { it.pkg }
                        forbiddenPlugins.get().each { p -> if (pkgs.contains(p)) errors << "plugin ${p} (capacitor.plugins.json)" }
                    }
                }
            }
            if (dex == 0 || !pluginsJson) errors << "dex ${dex}개, capacitor.plugins.json ${pluginsJson ? '있음' : '없음'} - 검사 대상이 아니다"
            if (errors) throw new GradleException("${f.name}에 다른 마켓 결제 코드가 들어 있다: ${errors.join(', ')}")
            logger.lifecycle("verified ${f.name}: 금지 클래스 ${forbiddenClasses.get()} / 플러그인 ${forbiddenPlugins.get()} 없음")
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def store = variant.productFlavors.find { it.first == 'store' }?.second
        def rule = STORE_RULES[store]
        def N = variant.name.capitalize()

        def webCheck = tasks.register("check${N}WebPlatform") {
            def txt = file('src/main/assets/public/platform.txt')
            doLast {
                def got = txt.exists() ? txt.text.trim() : '(없음)'
                if (got != store) throw new GradleException(
                    "웹 파일이 '${got}'용인데 '${store}' 빌드다 - 먼저 npm run build:${store == 'play' ? 'android' : store} (또는 vite build --mode ${store == 'play' ? 'android' : store} && npx cap sync android)")
            }
        }
        tasks.matching { it.name == "pre${N}Build" }.configureEach { dependsOn webCheck }

        def verify = { String kind, artifact ->
            tasks.register("verify${N}${kind}", VerifyStoreArtifact) {
                artifactFiles.from(variant.artifacts.get(artifact))
                forbiddenClasses = rule.classes
                forbiddenPlugins = rule.plugins
            }
        }
        def apk = verify('Apk', com.android.build.api.artifact.SingleArtifact.APK.INSTANCE)
        def aab = verify('Bundle', com.android.build.api.artifact.SingleArtifact.BUNDLE.INSTANCE)
        tasks.matching { it.name == "assemble${N}" }.configureEach { finalizedBy apk }
        tasks.matching { it.name == "bundle${N}" }.configureEach { finalizedBy aab }
    }
}
