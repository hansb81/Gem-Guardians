<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem Guardians - 상점 목업 (시안 2)</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('../../assets/fonts/Galmuri11.woff2') format('woff2'); }
  :root {
    /* assets/gems/palette.hex 25색 (+ characters.hex 피부 2색은 안 씀) */
    --outline:#0d0a10; --bg1:#221c2b; --bg2:#3b3347; --bg3:#655a74; --bone:#e8dcc0;
    --blue-d:#0c1838; --blue-m:#1c3a76; --blue:#386cbc; --blue-l:#8cc4ee;
    --pur-d:#220e38; --pur-m:#48206e; --pur:#7a3cae; --pur-l:#c48ce6;
    --red-d:#3a0814; --red-m:#741426; --red:#b82a3c; --red-l:#ec6a6a;
    --brn-d:#3a2808; --brn-m:#7a5212; --gold:#c28a20; --gold-l:#f2d264;
    --grn-d:#0c2814; --grn-m:#1c5228; --grn:#3a8a3c; --grn-l:#9cd872;
    /* 가짜 반투명 대신 2px 체크무늬 디더 (단색 #0d0a10 + 투명, 그라데이션처럼 번지지 않음) */
    --dither: conic-gradient(var(--outline) 25%, transparent 0 50%, var(--outline) 0 75%, transparent 0);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--outline); color: var(--bone); font-family: 'Galmuri11', monospace; font-size: 11px; line-height: 14px; }
  body { padding: 16px; }
  img { image-rendering: pixelated; display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  button:focus-visible { outline: 2px solid var(--blue-l); outline-offset: 2px; }
  .t22 { font-size: 22px; line-height: 22px; }
  .ol { text-shadow: 1px 0 var(--outline), -1px 0 var(--outline), 0 1px var(--outline), 0 -1px var(--outline); }

  /* ---------- 검토용 페이지 크롬 (게임 UI 아님) ---------- */
  .toolbar { width: 540px; margin: 0 auto 10px; background: var(--bg1); border: 2px solid var(--bg2); padding: 10px; line-height: 18px; }
  .toolbar h1 { font-size: 11px; color: var(--gold-l); }
  .toolbar .vt { display: flex; gap: 6px; margin: 6px 0; }
  .toolbar .vt button { padding: 8px 12px; border: 2px solid var(--bg3); background: var(--bg2); min-height: 36px; }
  .toolbar .vt button.on { background: var(--pur); border-color: var(--gold-l); }
  .dbg { position: fixed; right: 12px; bottom: 12px; width: 260px; background: var(--bg1); border: 2px solid var(--gold); z-index: 1000; line-height: 18px; }
  .dbg > button { width: 100%; padding: 8px 10px; color: var(--gold-l); background: var(--bg2); }
  .dbg .body { padding: 8px 10px; display: grid; gap: 6px; max-height: 70vh; overflow: auto; }
  .dbg.closed .body { display: none; }
  .dbg label { display: flex; align-items: center; gap: 6px; }
  .dbg input[type=number] { width: 90px; font: inherit; background: var(--outline); color: var(--bone); border: 1px solid var(--bg3); padding: 2px 4px; }
  .dbg input[type=range] { flex: 1; }
  .dbg .sep { color: var(--bg3); border-top: 1px solid var(--bg2); padding-top: 4px; }
  .dbg .reset { padding: 4px 6px; border: 1px solid var(--bg3); background: var(--bg2); }
  body.shot { padding: 0; }
  body.shot .toolbar, body.shot .dbg { display: none; }
  body.shot .device { border: 0; }

  /* ---------- 디바이스 540x960 = 180x320 x3 ---------- */
  .device { position: relative; width: 540px; height: 960px; margin: 0 auto; overflow: hidden; background: var(--bg1); border: 3px solid var(--bg2); box-sizing: content-box; }
  .tempnote { position: absolute; right: 8px; top: 6px; color: var(--bg3); }

  /* ---------- 9-slice (원본 slice px → 화면 2배 border) ---------- */
  .n { border-style: solid; border-color: transparent; border-image-repeat: stretch; image-rendering: pixelated; }
  .n-plate { border-width: 16px; border-image-source: url('../../assets/ui/menu/plate.png'); border-image-slice: 8 fill; }
  .n-inset { border-width: 8px; border-image-source: url('../../assets/ui/menu/inset.png'); border-image-slice: 4 fill; }
  .n-pinset { border-width: 8px; border-image-source: url('../../assets/ui/panels/panel_inset.png'); border-image-slice: 4 fill; }
  .n-iron { border-width: 16px; border-image-source: url('../../assets/ui/panels/panel_iron.png'); border-image-slice: 8 fill; }
  .n-popup { border-width: 32px; border-image-source: url('../../assets/ui/menu/popup_menu.png'); border-image-slice: 16 fill; }
  .n-body { border-width: 8px; border-image-source: url('../../assets/ui/upgrade/tab_body.png'); border-image-slice: 4 fill; }
  .n-card { border-width: 8px; border-image-source: url('../../assets/ui/upgrade/card.png'); border-image-slice: 4 fill; }
  .n-card.sel { border-image-source: url('../../assets/ui/upgrade/card_selected.png'); }
  /* tab: manifest [L6,T6,R6,B3] → CSS slice 순서 T R B L */
  .n-tab { border-width: 12px 12px 6px 12px; border-image-slice: 6 6 3 6 fill; border-image-source: url('../../assets/ui/upgrade/tab_off.png'); }
  .n-tab.on { border-image-source: url('../../assets/ui/upgrade/tab_on.png'); }
  /* btn: manifest [L4,T4,R4,B5] */
  .n-btn { border-width: 8px 8px 10px 8px; border-image-slice: 4 4 5 4 fill; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--bone); }
  .b-gold { border-image-source: url('../../assets/ui/buttons/btn_gold.png'); color: var(--outline); }
  .b-primary { border-image-source: url('../../assets/ui/buttons/btn_primary.png'); }
  .b-secondary { border-image-source: url('../../assets/ui/buttons/btn_secondary.png'); }
  .b-danger { border-image-source: url('../../assets/ui/buttons/btn_danger.png'); }
  .b-disabled { border-image-source: url('../../assets/ui/upgrade/btn_disabled.png'); color: var(--bg3); }
  button:active > .b-gold, .b-gold:active { border-image-source: url('../../assets/ui/buttons/btn_gold_pressed.png'); padding-top: 2px; }
  button:active > .b-primary, .b-primary:active { border-image-source: url('../../assets/ui/buttons/btn_primary_pressed.png'); padding-top: 2px; }
  button:active > .b-secondary, .b-secondary:active { border-image-source: url('../../assets/ui/buttons/btn_secondary_pressed.png'); padding-top: 2px; }
  .poor-num { color: var(--red-l); }

  /* ---------- 상단: 닫기 + 재화 바 (메뉴와 같은 자리 154,28,232,56) ---------- */
  .close { position: absolute; left: 20px; top: 28px; width: 48px; height: 48px; display: grid; place-items: center; }
  .close img { width: 32px; height: 32px; }
  .close:active img { content: url('../../assets/ui/upgrade/btn_close_pressed.png'); }
  .bar { position: absolute; left: 154px; top: 28px; width: 232px; height: 56px; }
  .bar .ic { position: absolute; top: 12px; width: 32px; height: 32px; }
  .bar .box { position: absolute; top: 14px; height: 28px; display: flex; align-items: center; justify-content: flex-end; padding-right: 0; }
  .bar .box span { position: relative; top: -1px; }
  .bar .box.drop span { color: var(--red-l); }
  .bar .box.gain span { color: var(--grn-l); }
  .plus { position: absolute; left: 388px; top: 34px; width: 44px; height: 44px; display: grid; place-items: center; }
  .plus img { width: 32px; height: 32px; }
  .plus:active img { content: url('../../assets/ui/buttons/btn_plus_pressed.png'); }

  /* ---------- 탭 ---------- */
  .bigtabs { position: absolute; left: 12px; top: 96px; width: 516px; height: 48px; display: flex; gap: 4px; z-index: 2; }
  .bigtabs > button { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--bg3); }
  .bigtabs > button.on { color: var(--gold-l); height: 54px; } /* overlapBody 3 → 6px 본문과 겹침 */
  .bigtabs img.ic { width: 32px; height: 32px; }
  .badge { position: absolute; width: 16px; height: 16px; }
  .panel { position: absolute; left: 12px; top: 138px; width: 516px; bottom: 12px; display: flex; flex-direction: column; }
  .smalltabs { display: flex; gap: 4px; padding: 0 0 6px; }
  .smalltabs button { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--bg3); white-space: nowrap; }
  .smalltabs button.on { color: var(--gold-l); }
  .smalltabs img { width: 24px; height: 24px; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .grid { display: grid; grid-template-columns: 244px 244px; gap: 14px 12px; padding: 10px 0 16px; }

  /* 시안 2: 왼쪽 레일 + 1열 */
  .rail { position: absolute; left: 12px; top: 96px; width: 100px; display: flex; flex-direction: column; gap: 6px; }
  .rail button { position: relative; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--bg3); }
  .rail button.on { color: var(--gold-l); }
  .rail img { width: 24px; height: 24px; }
  .raildots { display: flex; gap: 2px; height: 24px; align-items: center; } .raildots i { width: 8px; height: 8px; }
  .device.v2 .panel { left: 118px; top: 96px; width: 410px; }
  .device.v2 .grid { grid-template-columns: 1fr; gap: 8px; }

  .hdr { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 2px 2px; border-bottom: 2px solid var(--bg2); }
  .hdr b { font-weight: normal; color: var(--gold-l); }
  .hdr i { font-style: normal; color: var(--bg3); }

  /* ---------- 카드 ---------- */
  .card { position: relative; height: 164px; display: block; width: 100%; }
  .card .slot { position: absolute; left: 4px; top: 4px; width: 44px; height: 44px; background: url('../../assets/ui/items/slot_normal.png') 0 0 / 44px 44px; image-rendering: pixelated; }
  .card .slot.locked { background-image: url('../../assets/ui/items/slot_locked.png'); }
  .slot > img.it { position: absolute; left: 8px; top: 8px; width: 28px; height: 28px; }
  .slot .cnt { position: absolute; right: 2px; bottom: 0; }
  .ph { position: absolute; left: 8px; top: 8px; width: 28px; height: 28px; display: grid; place-items: center; color: var(--outline); text-align: center; line-height: 11px; }
  .ph.sk { height: 20px; }
  .dots { position: absolute; left: 8px; top: 30px; display: flex; gap: 2px; }
  .dots i { width: 4px; height: 4px; }
  .stack { position: absolute; left: 4px; top: 4px; width: 76px; height: 44px; }
  .stack img { position: absolute; width: 32px; height: 32px; }
  .card .name { position: absolute; left: 56px; top: 4px; right: 4px; white-space: nowrap; overflow: hidden; }
  .card.wideicon .name, .card.wideicon .sub { left: 88px; }
  .card .sub { position: absolute; left: 56px; top: 32px; color: var(--blue-l); white-space: nowrap; }
  .card .desc { position: absolute; left: 4px; right: 4px; top: 54px; height: 42px; overflow: hidden; }
  .desc em { font-style: normal; color: var(--gold-l); }
  .card .price { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; white-space: nowrap; }
  .price img { width: 32px; height: 32px; margin-top: -4px; margin-bottom: -4px; }
  .price img.lk { width: 24px; height: 24px; }
  .price.small { font-size: 11px; }
  /* 해금: 132px 버튼 안에 글자+아이콘+숫자가 안 들어가서 버튼 위 작은 라벨로 */
  .price .pre { position: absolute; left: -8px; right: -8px; top: -24px; text-align: center; font-size: 11px; color: var(--gold-l); }
  .tag { position: absolute; right: -4px; top: -16px; padding: 2px 4px; background: var(--red); color: var(--bone); border: 2px solid var(--outline); z-index: 1; white-space: nowrap; }
  .tag.blue { background: var(--blue-m); }
  .tag.gray { background: var(--bg3); }
  .tag.gold { background: var(--gold); color: var(--outline); }
  .card.sold::after { content: ''; position: absolute; inset: -8px; background: var(--dither); background-size: 4px 4px; pointer-events: none; }
  .card.sold .price { z-index: 1; }
  .bump { color: var(--grn-l) !important; }

  /* 가로 한 줄 카드: 무료 카드, 그리고 시안 2의 모든 카드 */
  .card.row, .device.v2 .card:not(.banner) { grid-column: 1 / -1; height: 96px; }
  .card.row .desc, .device.v2 .card:not(.banner) .desc { left: 56px; top: 28px; right: 140px; height: 28px; }
  .card.row .sub, .device.v2 .card:not(.banner) .sub { top: 62px; }
  .card.row .name, .device.v2 .card:not(.banner) .name { right: 140px; }
  .card.row .price, .device.v2 .card:not(.banner) .price { left: auto; width: 132px; top: 16px; bottom: auto; }
  .card.row.wideicon .desc, .device.v2 .card.wideicon:not(.banner) .desc { left: 88px; }

  /* 배너 (한 줄 전체) */
  .card.banner { grid-column: 1 / -1; height: 220px; }
  .card.banner .art { position: absolute; left: 4px; top: 4px; width: 120px; height: 120px; display: grid; place-items: center; text-align: center; color: var(--outline); line-height: 16px; }
  .card.banner .name { left: 136px; }
  .card.banner .sub { left: 136px; top: 30px; }
  .card.banner .desc { left: 136px; top: 50px; height: 72px; }
  .card.banner .timer { position: absolute; left: 4px; bottom: 4px; width: 180px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .card.banner .price { left: auto; width: 220px; bottom: 0; }
  .card.banner .tags { position: absolute; left: 4px; top: 130px; display: flex; gap: 6px; }
  .card.banner .tags .tag { position: static; }
  .device.v2 .card.banner { height: 220px; }
  .device.v2 .card.banner .desc { right: 4px; height: 72px; }
  .device.v2 .card.banner .price { left: auto; right: 0; top: auto; bottom: 0; width: 180px; }
  .device.v2 .card.banner .timer { width: 168px; }
  
  .legal { grid-column: 1 / -1; display: flex; justify-content: center; gap: 4px; color: var(--bg3); padding: 4px 0 8px; }
  .legal button { min-height: 44px; padding: 0 8px; color: var(--bg3); text-decoration: underline; }

  /* ---------- 팝업 / 토스트 ---------- */
  .veil { position: absolute; inset: 0; background: var(--dither); background-size: 4px 4px; display: none; z-index: 50; }
  .veil.open { display: block; }
  .pop { position: absolute; left: 40px; width: 460px; top: 180px; }
  .pop .x { position: absolute; right: -24px; top: -24px; width: 44px; height: 44px; display: grid; place-items: center; }
  .pop .x img { width: 32px; height: 32px; }
  .pop .head { position: relative; height: 52px; }
  .pop .head .slot, .pop .head .stack, .pop .head .art { left: 0; top: 0; }
  .pop .head .slot { position: absolute; width: 44px; height: 44px; background: url('../../assets/ui/items/slot_normal.png') 0 0 / 44px 44px; image-rendering: pixelated; }
  .pop .head .art { position: absolute; width: 44px; height: 44px; display: grid; place-items: center; color: var(--outline); font-size: 11px; text-align: center; line-height: 11px; }
  .pop .head .name { position: absolute; left: 56px; top: 0; color: var(--gold-l); }
  .pop .head.wideicon .name, .pop .head.wideicon .sub { left: 88px; }
  .pop .head .sub { position: absolute; left: 56px; top: 30px; color: var(--blue-l); }
  .pop p { line-height: 18px; margin: 8px 0; }
  .pop .info { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 4px 6px; margin: 8px 0; }
  .pop .info dt { color: var(--bg3); }
  .qty { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
  .qty .n-btn { width: 44px; height: 44px; }
  .qty .q { width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .qty .quick { width: 52px; }
  .total { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px; margin: 8px 0 12px; }
  .total span { display: flex; align-items: center; gap: 6px; }
  .total img { width: 32px; height: 32px; }
  .acts { display: flex; gap: 10px; }
  .acts .n-btn { flex: 1; height: 52px; }
  .store { height: 120px; display: grid; place-items: center; text-align: center; line-height: 18px; margin: 10px 0; color: var(--bg3); }
  .toast { position: absolute; left: 40px; right: 40px; bottom: 120px; display: none; align-items: center; justify-content: space-between; gap: 8px; z-index: 60; min-height: 76px; padding: 0 4px; }
  .toast.open { display: flex; }
  .toast .n-btn { height: 44px; padding: 0 10px; white-space: nowrap; }

  /* 가이드: 44px 터치 영역 확인 */
  .device.guides button { outline: 1px dashed var(--blue-l); outline-offset: -1px; }
  .device.guides .safe { display: block; }
  .safe { display: none; position: absolute; left: 0; right: 0; top: 0; height: 28px; border-bottom: 1px dashed var(--grn-l); color: var(--grn-l); padding: 6px 8px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .bump { color: inherit !important; } }
</style>
</head>
<body>
<div class="toolbar">
  <h1>상점 목업 · 540x960 (180x320 x3) · 메뉴 오른쪽 위 상점 아이콘에서 진입하는 전체 화면</h1>
  <div class="vt">
    
    <span>시안 2 확정 (2026-11-06) · 아트 적용판</span>
  </div>
  <div id="vdesc"></div>
</div>

<div class="device" id="dev" role="application" aria-label="상점 화면">
  <div class="safe">safe area 28px</div>
  <span class="tempnote">※ 숫자는 전부 임시</span>
  <button class="close" data-act="close" aria-label="닫기, 메뉴로"><img src="../../assets/ui/upgrade/btn_close.png" alt=""></button>
  <div class="bar n n-plate" style="position:absolute;border-width:16px" aria-label="재화">
  </div>
  <div class="bar" id="bar">
    <img class="ic" style="left:18px" src="../../assets/ui/icons/gold.png" alt="골드">
    <div class="box n n-inset" id="box-gold" style="left:50px;width:72px"><span class="ol" id="v-gold"></span></div>
    <img class="ic" style="left:132px" src="../../assets/ui/icons/diamond.png" alt="다이아">
    <div class="box n n-inset" id="box-dia" style="left:162px;width:62px"><span class="ol" id="v-dia"></span></div>
  </div>
  <button class="plus" data-act="plus" aria-label="다이아 충전"><img src="../../assets/ui/buttons/btn_plus.png" alt=""></button>
  <div id="nav"></div>
  <div class="panel n n-body" id="panel">
    <div class="smalltabs" id="small"></div>
    <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
  </div>
  <div class="veil" id="veil"><div class="pop n n-popup" id="pop"></div></div>
  <div class="toast n n-iron" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="dbg" id="dbg">
  <button data-act="dbg">디버그 패널 ▾ (목업 전용)</button>
  <div class="body">
    <label>최고 층 <input type="range" min="1" max="100" data-k="floor"><span id="d-floor"></span></label>
    <label>골드 <input type="number" min="0" data-k="gold"></label>
    <label>다이아 <input type="number" min="0" data-k="dia"></label>
    <div class="sep">젬 스킬 해금 방식</div>
    <label><input type="radio" name="mode" value="A" data-k="mode"> A: 보스 클리어 + 골드</label>
    <label><input type="radio" name="mode" value="B" data-k="mode"> B: 골드만</label>
    <label><input type="radio" name="mode" value="C" data-k="mode"> C: 다이아로도 바로 해금</label>
    <div class="sep">구매 상태</div>
    <label><input type="checkbox" data-k="starter"> 스타터 팩 이미 구매</label>
    <label><input type="checkbox" data-k="bossLoss"> 방금 보스층 패배 (돌파 팩 노출)</label>
    <label><input type="checkbox" data-k="slot4"> 4번째 슬롯 열림</label>
    <label><input type="checkbox" data-k="adsRemoved"> 광고 제거 구매</label>
    <label><input type="checkbox" data-k="weekly"> 주간 패스 보유</label>
    <label><input type="checkbox" data-k="monthly"> 월간 패스 보유</label>
    <label><input type="checkbox" data-k="freeClaimed"> 오늘 무료 받음</label>
    <button class="reset" data-act="resetFirst">다이아 첫 구매 2배 되살리기</button>
    <div class="sep">보기</div>
    <label><input type="checkbox" data-k="guides"> 터치 영역·safe area 표시</label>
  </div>
</div>

<script>
const A = '../../assets/';
const SHOP = A + 'ui/shop/';
const IMG = { gold: A + 'ui/icons/gold.png', dia: A + 'ui/icons/diamond.png', lock: A + 'ui/icons/lock.png', badge: A + 'ui/menu/badge.png' };
const COLOR = { red: '#b82a3c', blue: '#386cbc', purple: '#7a3cae', yellow: '#f2d264', green: '#3a8a3c' };
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- 목업 상태 (가짜) ----------
const S = {
  v: 2, tab: 'gold.items', rail: 'items', floor: 12, gold: 2400, dia: 120, mode: 'A',
  starter: false, bossLoss: true, slot4: false, adsRemoved: false,
  weekly: true, weeklyClaimed: false, weeklyDays: 6, monthly: false, monthlyClaimed: false, monthlyDays: 29,

function drawCur() { $('v-gold').textContent = fmt(disp.gold); $('v-dia').textContent = fmt(disp.dia); }

// 재화 숫자 애니메이션 (가짜 구매)
function addCur(cur, delta) { S[cur] += delta; tween(cur); }
function tween(cur) {
  const box = $('box-' + cur), from = disp[cur], to = S[cur], t0 = performance.now(), dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 500;
  box.classList.remove('drop', 'gain'); box.classList.add(to < from ? 'drop' : 'gain');
  const step = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    disp[cur] = from + (to - from) * k; drawCur();
    if (k < 1) requestAnimationFrame(step); else setTimeout(() => box.classList.remove('drop', 'gain'), 300);
  };
  requestAnimationFrame(step);
}

// ---------- 팝업 ----------
function openPopup(p, step = 'confirm') {
  S.sel = p.id; S.popup = p.id; S.qty = S.qty || 1;
  const pr = p.price || {}, cur = pr.cur, total = (pr.amt || 0) * (p.qty ? S.qty : 1);
  const poor = (cur === 'gold' || cur === 'dia') && (cur === 'gold' ? S.gold : S.dia) < total;
  const headIcon = p.icon;
  let body = `<button class="x" data-act="pclose" aria-label="닫기"><img src="${A}ui/upgrade/btn_close.png" alt=""></button>
    <div class="head ${p.wide ? 'wideicon' : ''}">${headIcon}<span class="name t22 ol">${p.name}</span><span class="sub">${p.sub || ''}</span></div>
    <p>${p.long || p.desc}</p>`;
  if (p.info) body += `<dl class="info n n-pinset">${p.info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;

    else body += `<div class="store n n-pinset">여기서 스토어 결제 창이 뜹니다<br>(Google Play / App Store 자리)</div>
      <div class="total n n-pinset"><span>가격</span><span class="t22">₩${fmt(pr.amt)}</span></div>
      <div class="acts"><button class="n n-btn b-secondary t22" data-act="pclose">취소</button><button class="n n-btn b-gold t22" data-act="pay">결제하기</button></div>`;
  } else {
    if (p.qty) body += `<div class="qty"><button class="n n-btn b-secondary t22" data-act="q" data-d="-1" aria-label="하나 줄이기">−</button>
      <span class="q n n-inset t22">${S.qty}</span><button class="n n-btn b-secondary t22" data-act="q" data-d="1" aria-label="하나 늘리기">+</button>
      <span style="flex:1"></span>${[1, 5, 10].map(n => `<button class="n n-btn ${S.qty === n ? 'b-primary' : 'b-secondary'} quick" data-act="qset" data-n="${n}">${n}개</button>`).join('')}</div>`;
    body += `<div class="total n n-pinset"><span>총 가격</span><span><img src="${IMG[cur]}" alt=""><span class="t22 ${poor ? 'poor-num' : ''}">${fmt(total)}</span></span></div>
      <div class="acts"><button class="n n-btn b-secondary t22" data-act="pclose">취소</button>
      <button class="n n-btn ${poor ? 'b-disabled' : cur === 'gold' ? 'b-gold' : 'b-primary'} t22" data-act="buy">${pr.prefix || '구매'}</button></div>`;
  }
  $('pop').innerHTML = body;
  $('veil').classList.add('open');
  const h = $('pop').offsetHeight; $('pop').style.top = Math.max(100, Math.round((960 - h) / 2)) + 'px';

function closePopup() { $('veil').classList.remove('open'); S.popup = ''; S.qty = 1; render(); }

let toastTimer;
function toast(msg, action) {
  const el = $('toast');
  el.innerHTML = `<span style="padding-left:4px">${msg}</span>` + (action ? `<button class="n n-btn b-primary" data-act="goto" data-to="${action[1]}">${action[0]}</button>` : '');
  el.classList.add('open'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('open'), 2800);
}
function poorToast(cur) {
  if (cur === 'gold') toast('골드가 부족해요', ['골드 교환', 'goldex']);
  else toast('다이아가 부족해요', ['다이아 충전', 'dia']);
}
function goTo(where) {
  if (where === 'dia') { if (S.v === 1) S.tab = 'cash.dia'; else S.rail = 'dia'; }
  else { if (S.v === 1) S.tab = 'gold.gold'; else { S.rail = 'dia'; S.scrollTo = 'goldex'; } }
  $('scroll').scrollTop = 0; render(false);
}
function bumpOwned(key) {
  if (!key) return;
  document.querySelectorAll(`[data-sub="${key}"]`).forEach(e => { e.classList.add('bump'); setTimeout(() => e.classList.remove('bump'), 600); });
}
function doBuy(p) {
  const pr = p.price, q = p.qty ? S.qty : 1, total = pr.amt * q;
  if ((pr.cur === 'gold' ? S.gold : S.dia) < total) return poorToast(pr.cur);
  addCur(pr.cur, -total);
  const msg = p.buy(q);
  closePopup(); bumpOwned(p.subKey); toast(msg);
}

// ---------- 입력 ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'variant') { S.v = +b.dataset.v; render(false); }
  else if (act === 'big') { S.tab = b.dataset.k === 'gold' ? 'gold.items' : 'cash.rec'; render(false); }
  else if (act === 'small') { S.tab = b.dataset.k; render(false); }
  else if (act === 'rail') { S.rail = b.dataset.k; render(false); }
  else if (act === 'plus') goTo('dia');
  else if (act === 'close') toast('메뉴로 돌아갑니다 (목업)');
  else if (act === 'legal') toast(b.textContent + ' 페이지 자리');
  else if (act === 'goto') { $('toast').classList.remove('open'); goTo(b.dataset.to); }
  else if (act === 'dbg') $('dbg').classList.toggle('closed');
  else if (act === 'resetFirst') { S.firstBuy = S.firstBuy.map(() => true); render(); }
  else if (act === 'card') {
    const p = products.get(b.dataset.id); if (!p) return;
    if (p.state === 'locked') { S.sel = p.id; render(); return toast(p.lockMsg || p.lockText); }
    if (p.state === 'sold') return toast(p.soldText === '내일 다시' ? '내일 다시 받을 수 있어요' : p.soldText === '최대 레벨' ? '이미 최대 레벨이에요' : '이미 구매했어요');
    if (p.direct) { const m = p.buy(); render(); return toast(m); }
    const pr = p.price;
    if ((pr.cur === 'gold' || pr.cur === 'dia') && (pr.cur === 'gold' ? S.gold : S.dia) < pr.amt) { S.sel = p.id; render(); return poorToast(pr.cur); }
    S.qty = 1; openPopup(p);
  }
  else if (act === 'pclose') closePopup();
  else if (act === 'q') { S.qty = Math.max(1, Math.min(99, S.qty + +b.dataset.d)); openPopup(products.get(S.popup)); }
  else if (act === 'qset') { S.qty = +b.dataset.n; openPopup(products.get(S.popup)); }
  else if (act === 'buy') { const p = products.get(S.popup); if (p.price.cur === 'free') { const m = p.buy(); closePopup(); bumpOwned('dye'); toast(m); } else doBuy(p); }
  else if (act === 'pay') { const p = products.get(S.popup); p.buy(1); openPopup(p, 'done'); }
});
// 무료 카드는 팝업에서 "받기"

function syncDbg() {
  document.querySelectorAll('#dbg [data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') el.checked = !!S[k];
    else if (el.type === 'radio') el.checked = S[k] === el.value;
    else if (document.activeElement !== el) el.value = S[k];
  });

}

  else { S[k] = Math.max(0, Number(el.value) || 0); if (k === 'gold' || k === 'dia') disp[k] = S[k]; }
  if (k === 'weekly' || k === 'monthly') S[k + 'Claimed'] = false;
  render();
});

// 배너 타이머만 1초마다 갱신 (전체 다시 그리기 없음)
setInterval(() => {
  document.querySelectorAll('[data-timer]').forEach(el => {
    const t = Math.max(0, +el.dataset.timer - 1); el.dataset.timer = t;
    el.querySelector('.t22').textContent = [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60].map(x => String(x).padStart(2, '0')).join(':');
  });
}, 1000);

render(false);
if (S.popup) { const p = products.get(S.popup), q = S.qty; if (p) { S.qty = q; openPopup(p); } }

// 자체 점검: ?selftest=1 → 클릭 흐름을 돌리고 결과를 <title>에 적는다 (목업 동작 확인용)
if (P.has('selftest')) {
  const click = sel => document.querySelector(sel).click(), fails = [];
  const ok = (c, m) => { if (!c) fails.push(m); };
  S.gold = disp.gold = 100000; S.dia = disp.dia = 1000; S.floor = 12; render(false);
  const h0 = S.owned.hammer, g0 = S.gold;
  click('[data-id="item.hammer"]'); click('[data-act=qset][data-n="5"]'); click('[data-act=buy]');
  ok(S.owned.hammer === h0 + 5 && S.gold === g0 - gp(1) * 5, 'gold buy qty 5');
  S.gold = 0; render(); click('[data-id="item.repair"]'); ok($('toast').textContent.includes('골드가 부족'), 'poor toast');
  click('#toast [data-act=goto]'); ok(S.tab === 'gold.gold', 'toast goto gold tab');
  S.tab = 'gold.items'; render(false); click('[data-id="item.defuse"]'); ok($('toast').textContent.includes('21층'), 'locked toast');
  S.tab = 'cash.rec'; render(false); const d0 = S.dia;
  click('[data-id="pack.starter"]'); click('[data-act=pay]'); ok(S.starter && S.dia === d0 + 300, 'krw pay');
  click('[data-act=pclose]'); ok(!products.has('pack.starter'), 'one-time pack hidden');
  const d1 = S.dia; click('[data-id="pass.weekly"]'); ok(S.dia === d1 + 60 && S.weeklyClaimed, 'pass claim');
  S.tab = 'gold.skills'; S.gold = 100000; S.mode = 'A'; render(false);
  ok(products.get('skill.soul').state === 'locked', 'mode A locks soul');
  S.mode = 'B'; render(); ok(products.get('skill.soul').price.cur === 'gold' && !products.get('skill.soul').state, 'mode B gold unlock');
  S.mode = 'C'; render(); ok(products.get('skill.soul').price.cur === 'dia', 'mode C dia unlock');
  click('[data-id="skill.red"]'); const r0 = S.lv.red; click('[data-act=buy]'); ok(S.lv.red === r0 + 1, 'skill level up');
  document.title = fails.length ? 'SELFTEST FAIL: ' + fails.join(', ') : 'SELFTEST OK';
}
</script>
</body>
</html>
