<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem Guardians - 출석 체크 시안</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('../assets/fonts/Galmuri11.woff2') format('woff2'); font-display: swap; }
  :root {
    /* palette.hex 25색만 사용 */
    --outline: #0d0a10; --bg1: #221c2b; --bg2: #3b3347; --bg3: #655a74; --bone: #e8dcc0;
    --blue-d: #0c1838; --blue-m: #1c3a76; --blue: #386cbc; --blue-l: #8cc4ee;
    --pur-d: #220e38; --pur-m: #48206e; --pur: #7a3cae; --pur-l: #c48ce6;
    --red-d: #3a0814; --red-m: #741426; --red: #b82a3c; --red-l: #ec6a6a;
    --brn-d: #3a2808; --brn-m: #7a5212; --gold: #c28a20; --gold-l: #f2d264;
    --grn-d: #0c2814; --grn-m: #1c5228; --grn: #3a8a3c; --grn-l: #9cd872;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; color: var(--bone); font-family: 'Galmuri11', monospace; font-size: 12px; -webkit-font-smoothing: none; }
  body { padding: 20px; }
  img { image-rendering: pixelated; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--blue-l); outline-offset: 2px; }

  /* ---- 검토용 크롬(게임 UI 아님) ---- */
  .toolbar { max-width: 540px; margin: 0 auto 12px; background: var(--bg1); border: 2px solid var(--outline); padding: 12px; line-height: 1.8; }
  .toolbar h1 { font-size: 12px; color: var(--gold-l); }
  .toolbar .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .toolbar button { background: var(--bg2); border: 2px solid var(--outline); padding: 8px 12px; min-height: 36px; }
  .toolbar button.on { background: var(--pur); }

  /* ---- 디바이스 540x960 = 180x320 x3 ---- */
  .device { position: relative; width: 540px; height: 960px; margin: 0 auto; overflow: hidden; border: 3px solid var(--outline);
    background: url('../assets/menu/menu_bg.png') center / cover no-repeat, var(--bg1); image-rendering: pixelated; }
  .dim { position: absolute; inset: 0; background: rgba(13, 10, 16, .72); }

  /* 팝업 틀: popup_win 48x48, 9-slice 16 -> 화면 2배 */
  .popup { position: absolute; left: 24px; right: 24px; top: 92px; bottom: 60px;
    border: 32px solid transparent; border-image: url('../assets/ui/popups/popup_win.png') 16 fill / 32px stretch;
    image-rendering: pixelated; display: flex; flex-direction: column; padding: 18px 2px 0; }
  .emblem { position: absolute; left: 50%; top: -62px; width: 72px; height: 72px; transform: translateX(-50%); }
  .close { position: absolute; right: -22px; top: -22px; width: 48px; height: 48px; border: 0;
    background: url('../assets/ui/upgrade/btn_close.png') center / 48px no-repeat; }
  .close:active { background-image: url('../assets/ui/upgrade/btn_close_pressed.png'); }

  .title { text-align: center; font-size: 22px; color: var(--gold-l); text-shadow: 2px 2px 0 var(--outline); }
  .sub { display: flex; justify-content: space-between; align-items: center; margin: 10px 2px 8px; font-size: 13px; }
  .sub b { color: var(--gold-l); }
  .reset { color: var(--blue-l); }

  /* 진행 바 (누적 출석) */
  .progress { position: relative; height: 18px; margin: 0 2px 12px; background: var(--outline); border: 2px solid var(--outline); }
  .progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); box-shadow: inset 0 -4px 0 var(--brn-m), inset 0 3px 0 var(--gold-l); transition: width .25s steps(6); }
  .progress span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 14px; text-shadow: 1px 1px 0 var(--outline); }

  /* 달력: 5열 x 6줄 = 30칸 */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px; flex: 1; min-height: 0; }
  .day { position: relative; border: 8px solid transparent; border-image: url('../assets/ui/upgrade/card.png') 4 fill / 8px stretch;
    image-rendering: pixelated; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 0 0 2px; min-height: 0; background: none; }
  .day .n { align-self: flex-start; font-size: 11px; color: var(--bone); background: var(--bg1); padding: 1px 4px; margin: -4px 0 0 -4px; }
  .day .icon { width: 32px; height: 32px; }
  .day .amt { font-size: 12px; text-shadow: 1px 1px 0 var(--outline); }

  /* 보상 칸 종류 */
  .day.big { border-image-source: url('../assets/ui/upgrade/card_selected.png'); }
  .day.big .n { background: var(--gold); color: var(--outline); }
  .day.big .icon { width: 40px; height: 40px; }
  .day.final { grid-column: span 1; }
  .day.final .n { background: var(--pur); color: var(--bone); }

  /* 상태 */
  .day.claimed .icon, .day.claimed .amt { opacity: .35; }
  .day.claimed::after { content: ''; position: absolute; inset: 14px 8px 8px; margin: auto; width: 46px; height: 46px;
    background: var(--grn); border: 3px solid var(--outline); box-shadow: inset -3px -3px 0 var(--grn-m), inset 3px 3px 0 var(--grn-l); transform: rotate(-12deg);
    -webkit-mask: none; }
  .day.claimed::before { content: ''; position: absolute; z-index: 1; left: 50%; top: 50%; width: 22px; height: 11px; margin: -8px 0 0 -11px;
    border-left: 5px solid var(--bone); border-bottom: 5px solid var(--bone); transform: rotate(-50deg); }
  .day.today { animation: pulse 1s steps(2) infinite; }
  .day.today .n { background: var(--red); color: var(--bone); }
  .day.today::after { content: '오늘'; position: absolute; top: -10px; right: -10px; font-size: 11px;
    background: var(--red); color: var(--bone); border: 2px solid var(--outline); padding: 1px 6px; white-space: nowrap; }
  .day.missed .icon, .day.missed .amt { opacity: .35; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }
  @media (prefers-reduced-motion: reduce) { .day.today { animation: none; filter: brightness(1.25); } .progress i { transition: none; } }

  /* 하단 버튼: btn_gold 9-slice [4,4,4,5] -> 3배 */
  .footer { display: flex; gap: 10px; align-items: center; padding: 14px 2px 0; }
  .footer .tip { flex: 1; font-size: 12px; line-height: 1.6; color: var(--bone); }
  .footer .tip b { color: var(--pur-l); }
  .btn { min-width: 168px; height: 60px; font-size: 18px; border: 12px solid transparent; border-bottom-width: 15px;
    border-image: url('../assets/ui/buttons/btn_gold.png') 4 4 5 4 fill / 12px 12px 15px 12px stretch; image-rendering: pixelated;
    color: var(--outline); background: none; padding: 0; }
  .btn:active { border-image-source: url('../assets/ui/buttons/btn_gold_pressed.png'); padding-top: 3px; }
  .btn:disabled { border-image-source: url('../assets/ui/upgrade/btn_disabled.png'); border-image-slice: 4; border-width: 12px; color: var(--bg3); cursor: default; }

  /* 받기 연출: 보상 토스트 */
  .toast { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
    background: var(--bg1); border: 3px solid var(--outline); box-shadow: 0 0 0 3px var(--gold); padding: 16px 24px; text-align: center; font-size: 16px;
    transition: transform .18s steps(3), opacity .18s steps(3); }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast img { width: 48px; height: 48px; display: block; margin: 0 auto 8px; }
  .toast b { color: var(--gold-l); }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>GEM GUARDIANS - 출석 체크 시안 (배치/흐름 검토용, 최종 그림 아님)</h1>
    <div>30일 달력. 7/14/21/28일은 큰 보상(금테), 30일은 최종 보상(보라). 오늘 칸은 깜빡이고 "받기"를 누르면 도장이 찍힙니다. 보상 종류·양은 예시입니다.</div>
    <div class="row" id="presets">
      <button data-day="1">1일차</button>
      <button data-day="7" class="on">7일차</button>
      <button data-day="16">16일차</button>
      <button data-day="30">30일차</button>
    </div>
  </div>

  <div class="device">
    <div class="dim"></div>
    <section class="popup" role="dialog" aria-labelledby="attTitle">
      <img class="emblem" src="../assets/ui/popups/emblem_win.png" alt="">
      <button class="close" aria-label="닫기"></button>
      <h2 class="title" id="attTitle">출석 체크</h2>
      <div class="sub"><span>누적 <b id="count">6</b> / 30일</span><span class="reset">초기화까지 23일</span></div>
      <div class="progress" aria-hidden="true"><i id="bar"></i><span id="barText"></span></div>
      <div class="grid" id="grid"></div>
      <div class="footer">
        <p class="tip" id="tip"></p>
        <button class="btn" id="claim">받기</button>
      </div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

<script>
  // 보상표(예시) - kind: gold | diamond. big = 주간 큰 보상, final = 30일 보상.
  const G = '../assets/ui/icons/gold.png', D = '../assets/ui/icons/diamond.png';
  const REWARDS = Array.from({ length: 30 }, (_, i) => {
    const d = i + 1;
    if (d === 30) return { d, icon: D, amt: 300, label: '다이아', tier: 'final' };
    if (d % 7 === 0) return { d, icon: D, amt: 50 + d * 2, label: '다이아', tier: 'big' };
    if (d % 3 === 0) return { d, icon: D, amt: 10, label: '다이아' };
    return { d, icon: G, amt: 100 + d * 20, label: '골드' };
  });

  const grid = document.getElementById('grid');
  let claimed = new Set(), today = 7, missed = new Set();

  function render() {
    grid.innerHTML = '';
    for (const r of REWARDS) {
      const el = document.createElement('button');
      const state = claimed.has(r.d) ? 'claimed' : missed.has(r.d) ? 'missed' : r.d === today ? 'today' : '';
      el.className = `day ${r.tier ?? ''} ${state}`;
      el.disabled = state !== 'today';
      el.setAttribute('aria-label', `${r.d}일 ${r.label} ${r.amt}${state === 'claimed' ? ', 받음' : state === 'today' ? ', 오늘 받을 수 있음' : ''}`);
      el.innerHTML = `<span class="n">${r.d}</span><img class="icon" src="${r.icon}" alt=""><span class="amt">${r.amt}</span>`;
      el.onclick = claim;
      grid.appendChild(el);
    }
    const n = claimed.size;
    document.getElementById('count').textContent = n;
    document.getElementById('bar').style.width = `${(n / 30) * 100}%`;
    document.getElementById('barText').textContent = `다음 큰 보상까지 ${Math.max(0, (Math.ceil((n + 1) / 7) * 7 > 30 ? 30 : Math.ceil((n + 1) / 7) * 7) - n)}일`;
    const canClaim = !claimed.has(today) && today <= 30;
    const btn = document.getElementById('claim');
    btn.disabled = !canClaim;
    btn.textContent = canClaim ? '받기' : '내일 다시';
    const next = REWARDS.find((r) => r.tier && r.d > n);
    document.getElementById('tip').innerHTML = next ? `<b>${next.d}일</b> 보상: ${next.label} ${next.amt}<br>누적 출석: 빠진 날 없이 다음 칸부터 이어서 받습니다(예시 규칙).` : '30일 보상을 모두 받았습니다.';
  }

  function claim() {
    if (claimed.has(today)) return;
    claimed.add(today);
    const r = REWARDS[today - 1];
    const t = document.getElementById('toast');
    t.innerHTML = `<img src="${r.icon}" alt="">${r.d}일 보상<br><b>${r.label} +${r.amt}</b>`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1100);
    render();
  }
  document.getElementById('claim').onclick = claim;

  // 미리보기 상태 - 날짜만 채운 단순 모델(시안용).
  function preset(day) {
    today = day; missed = new Set(); claimed = new Set();
    for (let d = 1; d < day; d++) claimed.add(d);
    if (day === 30) claimed.add(30);
    document.querySelectorAll('#presets button').forEach((b) => b.classList.toggle('on', +b.dataset.day === day));
    render();
  }
  document.querySelectorAll('#presets button').forEach((b) => (b.onclick = () => preset(+b.dataset.day)));
  preset(7);
</script>
</body>
</html>
